[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

build_src_filter =
    +<esp32/>
build_flags = 
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DBOARD_HAS_PSRAM
board_upload.flash_size = 4MB
board_build.partitions = huge_app.csv

monitor_speed = 115200
lib_deps = 
    madhephaestus/ESP32Servo 
    mikalhart/TinyGPSPlus 
    https://github.com/AlfredoSystems/AlfredoCRSF 
    adafruit/Adafruit LSM6DS
    adafruit/Adafruit Unified Sensor
    adafruit/Adafruit BusIO
    https://github.com/adafruit/Adafruit_LPS2X

[env:dx-lr30]
platform = ststm32
board = genericSTM32F103C8
framework = arduino

build_src_filter =
    +<dx-lr30/main.cpp>

lib_deps =
    jgromes/RadioLib @ ^7.8.1

; The DX-LR30 dev board has a CH340C whose DTR -> NRST and RTS -> BOOT0.
; stm32flash must toggle them to enter (RTS high, reset pulse) and leave
; (RTS low, reset pulse) the ROM bootloader, otherwise "Failed to init device".
; Each trailing ',' adds 100 ms; the bootloader needs a settle delay after
; reset is released before the sync byte is sent, or init times out.
upload_protocol = serial
upload_speed = 115200
upload_flags =
    -i
    rts,-dtr,dtr,,:-rts,-dtr,dtr

; Route `Serial` to USART1 (PA9/PA10), which is what the CH340C is wired to.
; The variant default is USART2 on PA2/PA3, which are the SX1262 BUSY/RESET pins.
build_flags =
    -D SERIAL_UART_INSTANCE=1
    -D PIN_SERIAL_TX=PA9
    -D PIN_SERIAL_RX=PA10

monitor_speed = 115200
; The board holds the MCU in reset only when DTR is low while RTS is high;
; keep both low so opening the monitor never stalls the running program.
monitor_dtr = 0
monitor_rts = 0

; LoRa telemetry link test: flash one module with each env.
; Both CH340Cs report the same VID:PID and no serial number, so auto-detect
; always picks the same one. macOS names each port after the USB socket it is
; plugged into, so these stay valid as long as each module keeps its socket.
[env:dx-lr30-sender]
extends = env:dx-lr30
build_src_filter =
    +<dx-lr30/Telemetry/Sender.cpp>
upload_port = /dev/cu.usbserial-10
monitor_port = /dev/cu.usbserial-10

[env:dx-lr30-receiver]
extends = env:dx-lr30
build_src_filter =
    +<dx-lr30/Telemetry/Receiver.cpp>
upload_port = /dev/cu.usbserial-210
monitor_port = /dev/cu.usbserial-210
